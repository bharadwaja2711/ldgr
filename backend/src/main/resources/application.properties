spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/ldgr
spring.datasource.username=ldgr
spring.datasource.password=ldgr

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
ldgr.security.jwt.secret=${LDGR_JWT_SECRET}
ldgr.security.jwt.access-token-expiration=900000
ldgr.security.jwt.refresh-token-expiration=604800000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email